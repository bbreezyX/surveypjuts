    <link rel="preconnect" href="https://mt1.google.com" />
    <!-- The survey points are the whole point of the page and only 18KB gzipped,
         but OpenLayers cannot ask for them until ol.js and the layer scripts have
         all landed — which put the request at ~5.9s on a mid-range phone over
         Slow 4G. Preloading starts it immediately, in parallel with the scripts.
         The href must stay byte-identical to the url in layers/layers.js or the
         file gets fetched twice. -->
    <link rel="preload" href="./data/points.geojson" as="fetch" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./resources/ol.css?v=202608171218" />
    <link rel="stylesheet" href="resources/fontawesome-all.min.css?v=202608171218" />
    <link rel="stylesheet" type="text/css" href="resources/horsey.min.css?v=202608171218" />
    <link
      rel="stylesheet"
      type="text/css"
      href="resources/ol-search-layer.min.css?v=202608171218"
    />
    <link
      href="resources/photon-geocoder-autocomplete.min.css?v=202608171218"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css?v=202608171218" />
    <link rel="stylesheet" href="./resources/qgis2web.css?v=202608171218" />
    <link rel="preload" href="./custom.css?v=202608171218" as="style" />
    <link rel="stylesheet" href="./custom.css?v=202608171218" />
    <title>Peta Sebaran PUTS 2026 · Penerangan Umum Tenaga Surya Provinsi Jambi</title>
  </head>
  <body>
    <noscript>
      <p class="noscript-note">
        Peta ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda,
        lalu muat ulang halaman.
      </p>
    </noscript>
    <div class="app-shell">
      <header class="masthead">
        <img
          class="masthead-lambang"
          src="./assets/lambang-jambi.svg?v=202608171218"
          alt="Lambang Provinsi Jambi"
          width="34"
          height="40"
          decoding="async"
        />
        <div class="masthead-copy">
          <p class="masthead-kicker">Pemprov Jambi &middot; Dinas ESDM</p>
          <h1 class="masthead-title">Peta Sebaran PUTS 2026</h1>
        </div>
      </header>

      <aside id="sidebar" aria-label="Daftar titik PUTS">
        <button
          id="sheet-handle"
          type="button"
          aria-controls="sidebar"
          aria-expanded="false"
          aria-label="Buka atau tutup daftar titik"
        ></button>
        <button id="sidebar-close" type="button" aria-label="Tutup panel data">
          &times;
        </button>

        <div class="panel-brand">
          <img
            class="panel-brand__lambang"
            src="./assets/lambang-jambi.svg?v=202608171218"
            alt="Lambang Provinsi Jambi"
            width="34"
            height="40"
            decoding="async"
          />
          <div class="panel-brand__copy">
            <p class="panel-brand__kicker">Pemprov Jambi &middot; Dinas ESDM</p>
            <h1 class="panel-brand__title">Peta Sebaran PUTS 2026</h1>
          </div>
        </div>

        <div class="sidebar-header">
          <label class="search-field" for="list-search">
            <span class="visually-hidden">Cari titik PUTS</span>
            <span class="search-icon" aria-hidden="true"></span>
            <input
              id="list-search"
              type="search"
              placeholder="Cari nomor, nama, alamat..."
              autocomplete="off"
            />
            <button
              id="list-search-clear"
              class="search-clear"
              type="button"
              aria-label="Hapus pencarian"
            ></button>
          </label>

          <div class="group-mode-field">
            <span class="group-mode-label" id="group-mode-label">Kelompok</span>
            <div class="group-mode" role="group" aria-labelledby="group-mode-label">
              <button
                type="button"
                class="group-mode__btn is-active"
                data-mode="nama"
                aria-pressed="true"
              >
                Pengusul
              </button>
              <button
                type="button"
                class="group-mode__btn"
                data-mode="kabupaten"
                aria-pressed="false"
              >
                Kabupaten
              </button>
            </div>
          </div>

          <div class="summary-row">
            <p class="list-summary" id="list-summary">230 titik</p>
            <button id="fit-map" class="link-action" type="button">
              Lihat semua
            </button>
          </div>
        </div>

        <div class="sidebar-scroll">
          <div id="list-data" aria-live="polite">
            <div class="loading-state" role="status">
              <span class="loading-spinner" aria-hidden="true"></span>
              Memuat data titik&hellip;
            </div>
          </div>
        </div>

        <p class="sidebar-footer">
          Sumber: survey lapangan 2026 &middot; Dinas ESDM Provinsi Jambi
        </p>
      </aside>

      <button
        id="panel-toggle"
        class="panel-toggle"
        type="button"
        aria-controls="sidebar"
        aria-expanded="false"
        aria-label="Tampilkan atau sembunyikan panel data"
        data-tooltip="Sembunyikan panel"
      >
        <span class="panel-toggle__chevron" aria-hidden="true"></span>
      </button>

      <main class="map-frame">
        <div id="map" aria-label="Peta sebaran PUTS">
          <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer" aria-label="Tutup info titik"></a>
            <div id="popup-content"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="resources/qgis2web_expressions.js?v=202608171218"></script>
    <script src="./resources/functions.js?v=202608171218"></script>
    <script src="./resources/ol.js?v=202608171218"></script>
    <script src="resources/horsey.min.js?v=202608171218"></script>
    <script src="resources/ol-search-layer.js?v=202608171218"></script>
    <script src="./resources/ol-layerswitcher.js?v=202608171218"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js?v=202608171218"></script>
    <script src="layers/BatasKabupaten2011_1.js?v=202608171218"></script>
    <script src="styles/BatasKabupaten2011_1_style.js?v=202608171218"></script>
    <script src="styles/Dissolved_2_style.js?v=202608171218"></script>
    <script src="styles/260331_4_style.js?v=202608171218"></script>
    <script src="./layers/layers.js?v=202608171218" type="text/javascript"></script>

    <script src="./custom.js?v=202608171218"></script>
  </body>
</html>
