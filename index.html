<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width"
    />
    <meta
      name="description"
      content="Peta sebaran Penerangan Jalan Umum Tenaga Surya Provinsi Jambi Tahun 2026 hasil survey lapangan."
    />
    <meta name="theme-color" content="#293d50" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./favicon.svg?v=202606151430" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://mt1.google.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./resources/ol.css?v=202606151430" />
    <link rel="stylesheet" href="resources/fontawesome-all.min.css?v=202606151430" />
    <link rel="stylesheet" type="text/css" href="resources/horsey.min.css?v=202606151430" />
    <link
      rel="stylesheet"
      type="text/css"
      href="resources/ol-search-layer.min.css?v=202606151430"
    />
    <link
      href="resources/photon-geocoder-autocomplete.min.css?v=202606151430"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css?v=202606151430" />
    <link rel="stylesheet" href="./resources/qgis2web.css?v=202606151430" />
    <link rel="preload" href="./custom.css?v=202606151822" as="style" />
    <link rel="stylesheet" href="./custom.css?v=202606151822" />
    <title>Peta Sebaran PJUTS 2026 · Penerangan Jalan Umum Tenaga Surya Provinsi Jambi</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="masthead">
        <img
          class="masthead-lambang"
          src="./assets/lambang-jambi.svg?v=202606151430"
          alt="Lambang Provinsi Jambi"
          width="34"
          height="40"
          decoding="async"
        />
        <div class="masthead-copy">
          <p class="masthead-kicker">Pemprov Jambi &middot; Dinas ESDM</p>
          <h1 class="masthead-title">Peta Sebaran PJUTS 2026</h1>
        </div>
      </header>

      <aside id="sidebar" aria-label="Daftar titik PJUTS">
        <button
          id="sheet-handle"
          type="button"
          aria-controls="sidebar"
          aria-expanded="false"
          aria-label="Buka atau tutup daftar titik"
        ></button>
        <button id="sidebar-close" type="button" aria-label="Tutup panel data">
          &times;
        </button>

        <div class="sidebar-header">
          <div class="sidebar-stats" aria-label="Ringkasan data">
            <div class="stat stat--lead">
              <strong id="count-points">0</strong>
              <span>titik</span>
            </div>
            <div class="stat">
              <strong id="count-groups">0</strong>
              <span id="count-groups-label">pengusul</span>
            </div>
            <div class="stat">
              <strong id="count-visible">0</strong>
              <span>tampil</span>
            </div>
          </div>

          <div class="sidebar-actions">
            <label class="search-field" for="list-search">
              <span class="visually-hidden">Cari titik PJUTS</span>
              <i class="fas fa-search search-icon" aria-hidden="true"></i>
              <input
                id="list-search"
                type="search"
                placeholder="Cari nomor, pengusul, alamat..."
                autocomplete="off"
              />
            </label>
            <button id="fit-map" class="secondary-action" type="button">
              Lihat semua
            </button>
          </div>

          <div class="group-mode-field">
            <span class="group-mode-label" id="group-mode-label">Kelompokkan berdasarkan:</span>
            <div class="group-mode" role="group" aria-labelledby="group-mode-label">
              <button
                type="button"
                class="group-mode__btn is-active"
                data-mode="nama"
                aria-pressed="true"
              >
                Pengusul
              </button>
              <button
                type="button"
                class="group-mode__btn"
                data-mode="kabupaten"
                aria-pressed="false"
              >
                Kabupaten
              </button>
            </div>
          </div>
        </div>

        <div class="sidebar-scroll">
          <div id="list-data" aria-live="polite"></div>
        </div>

        <p class="sidebar-footer">
          Sumber: survey lapangan 2026 &middot; Dinas ESDM Provinsi Jambi
        </p>
      </aside>

      <button
        id="panel-toggle"
        class="panel-toggle"
        type="button"
        aria-controls="sidebar"
        aria-expanded="false"
        aria-label="Tampilkan atau sembunyikan panel data"
      >
        <span class="panel-toggle__chevron" aria-hidden="true"></span>
      </button>

      <main class="map-frame">
        <div id="map" aria-label="Peta sebaran PJUTS">
          <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer" aria-label="Tutup info titik"></a>
            <div id="popup-content"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="resources/qgis2web_expressions.js?v=202606151430"></script>
    <script src="./resources/functions.js?v=202606151430"></script>
    <script src="./resources/ol.js?v=202606151430"></script>
    <script src="resources/horsey.min.js?v=202606151430"></script>
    <script src="resources/ol-search-layer.js?v=202606151430"></script>
    <script src="./resources/ol-layerswitcher.js?v=202606151430"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js?v=202606151430"></script>
    <script src="layers/BatasKabupaten2011_1.js?v=202606151430"></script>
    <script src="layers/Dissolved_2.js?v=202606151430"></script>
    <script src="styles/BatasKabupaten2011_1_style.js?v=202606151430"></script>
    <script src="styles/Dissolved_2_style.js?v=202606151430"></script>
    <script src="styles/260331_4_style.js?v=202606151430"></script>
    <script src="./layers/layers.js?v=202606151430" type="text/javascript"></script>
    <script src="./resources/Autolinker.min.js?v=202606151430"></script>
    <script src="./resources/qgis2web.js?v=202606151430"></script>
    <script src="./custom.js?v=202606181300"></script>
  </body>
</html>
